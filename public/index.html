<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <meta name="description" content="Add, view, update and delete student records – a full-stack CRUD app built with Node.js, Express and MongoDB.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50' y='68' font-family='Arial' font-size='58' font-weight='bold' fill='white' text-anchor='middle'>S</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <div class="brand">
          <span class="brand-logo" aria-hidden="true">S</span>
          <div>
            <h1>Student Management</h1>
            <p class="muted">Add, view, update and delete student records</p>
          </div>
        </div>
        <button type="button" class="btn btn-primary" id="add-btn">
          <span aria-hidden="true">＋</span> Add Student
        </button>
      </div>
    </header>

    <main class="container">
      <!-- Dashboard stat cards (filled by app.js from GET /api/students/stats) -->
      <section aria-label="Statistics">
        <div class="stats" id="stats">
          <div class="stat-card stat-total"><span class="stat-label">Total Students</span><span class="stat-value">–</span></div>
        </div>
      </section>

      <section class="panel" aria-label="Students">
        <div class="toolbar">
          <div class="search">
            <label for="search" class="sr-only">Search students</label>
            <svg aria-hidden="true" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
            <input type="search" id="search" placeholder="Search name, roll no. or email" autocomplete="off">
          </div>
          <label for="course-filter" class="sr-only">Filter by course</label>
          <select id="course-filter">
            <option value="">All courses</option>
          </select>
          <label for="year-filter" class="sr-only">Filter by year</label>
          <select id="year-filter">
            <option value="">All years</option>
            <option value="1">Year 1</option>
            <option value="2">Year 2</option>
            <option value="3">Year 3</option>
            <option value="4">Year 4</option>
          </select>
        </div>

        <p class="result-count muted" id="result-count" aria-live="polite"></p>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th scope="col">Roll No.</th>
                <th scope="col">Name</th>
                <th scope="col">Email</th>
                <th scope="col">Course</th>
                <th scope="col">Year</th>
                <th scope="col">Phone</th>
                <th scope="col"><span class="sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody id="student-rows"></tbody>
          </table>
        </div>

        <!-- Shown instead of the table while loading / when there are no results / on error -->
        <div class="state" id="state" hidden></div>

        <nav class="pagination" id="pagination" aria-label="Pagination" hidden>
          <button type="button" class="btn btn-ghost" id="prev-page">← Previous</button>
          <span id="page-info" class="muted"></span>
          <button type="button" class="btn btn-ghost" id="next-page">Next →</button>
        </nav>
      </section>
    </main>

    <footer class="container footer muted">Student Management System · Node.js, Express &amp; MongoDB</footer>

    <!-- Add / Edit modal -->
    <dialog id="form-modal" aria-labelledby="form-title">
      <form id="student-form" novalidate>
        <div class="modal-header">
          <h2 id="form-title">Add Student</h2>
          <button type="button" class="icon-btn" data-close aria-label="Close">✕</button>
        </div>
        <div class="modal-body form-grid">
          <div class="field">
            <label for="f-name">Full name *</label>
            <input id="f-name" name="name" type="text" required minlength="2" maxlength="80" autocomplete="off">
            <small class="field-error" data-error-for="name"></small>
          </div>
          <div class="field">
            <label for="f-rollNumber">Roll number *</label>
            <input id="f-rollNumber" name="rollNumber" type="text" required maxlength="20" autocomplete="off" placeholder="e.g. CS2023001">
            <small class="field-error" data-error-for="rollNumber"></small>
          </div>
          <div class="field">
            <label for="f-email">Email *</label>
            <input id="f-email" name="email" type="email" required autocomplete="off">
            <small class="field-error" data-error-for="email"></small>
          </div>
          <div class="field">
            <label for="f-phone">Phone *</label>
            <input id="f-phone" name="phone" type="tel" required autocomplete="off" placeholder="+91 9876543210">
            <small class="field-error" data-error-for="phone"></small>
          </div>
          <div class="field">
            <label for="f-course">Course *</label>
            <select id="f-course" name="course" required>
              <option value="">Select course</option>
            </select>
            <small class="field-error" data-error-for="course"></small>
          </div>
          <div class="field">
            <label for="f-year">Year *</label>
            <select id="f-year" name="year" required>
              <option value="">Select year</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
            <small class="field-error" data-error-for="year"></small>
          </div>
          <div class="field">
            <label for="f-gender">Gender *</label>
            <select id="f-gender" name="gender" required>
              <option value="">Select gender</option>
            </select>
            <small class="field-error" data-error-for="gender"></small>
          </div>
          <div class="field">
            <label for="f-dateOfBirth">Date of birth</label>
            <input id="f-dateOfBirth" name="dateOfBirth" type="date">
            <small class="field-error" data-error-for="dateOfBirth"></small>
          </div>
          <div class="field field-full">
            <label for="f-address">Address</label>
            <textarea id="f-address" name="address" rows="2" maxlength="200"></textarea>
            <small class="field-error" data-error-for="address"></small>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-btn">Save</button>
        </div>
      </form>
    </dialog>

    <!-- View details modal -->
    <dialog id="details-modal" aria-labelledby="details-title">
      <div class="modal-header">
        <h2 id="details-title">Student Details</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="details-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-close>Close</button>
        <button type="button" class="btn btn-primary" id="details-edit">Edit</button>
      </div>
    </dialog>

    <!-- Delete confirmation modal -->
    <dialog id="confirm-modal" class="modal-sm" aria-labelledby="confirm-title">
      <div class="modal-header">
        <h2 id="confirm-title">Delete student?</h2>
      </div>
      <div class="modal-body">
        <p id="confirm-text"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="button" class="btn btn-danger" id="confirm-delete">Delete</button>
      </div>
    </dialog>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
